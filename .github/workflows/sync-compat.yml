name: sync-compat

# On a CLI release tag, copy the compatibility range from compat.toml into
# plugin.json (metadata.requires_cli) and SKILL.md, and bump the plugin version.
on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/sync_compat.py "${GITHUB_REF_NAME#cli-v}"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin/ && git diff --cached --quiet || git commit -m "chore(plugin): sync compat range for ${GITHUB_REF_NAME}" && git push
