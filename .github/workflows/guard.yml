name: guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plugin-markdown-only:
    # The plugin must never run code on users' machines: no hooks, MCP servers,
    # executables, monitors or shell injection in skills. Code lives only in cli/.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Only .md, .txt and plugin.json inside plugin/
        run: |
          bad=$(find plugin -type f ! -name '*.md' ! -name '*.txt' ! -path 'plugin/.claude-plugin/plugin.json' || true)
          if [ -n "$bad" ]; then echo "Forbidden files in plugin/:"; echo "$bad"; exit 1; fi
      - name: No executable components declared
        run: |
          if grep -nE '"(hooks|mcpServers|lspServers|monitors|experimental|commands|agents|channels|userConfig)"' plugin/.claude-plugin/plugin.json; then
            echo "plugin.json declares executable or interactive components"; exit 1
          fi
          for d in plugin/bin plugin/hooks plugin/monitors; do
            [ -e "$d" ] && { echo "Forbidden directory: $d"; exit 1; }
          done
          true
      - name: No shell injection in skills
        run: |
          if grep -rn '!`' plugin/; then echo "Dynamic shell injection (!\`cmd\`) is forbidden in skills"; exit 1; fi
      - name: CLI README in sync with root README
        run: diff -q README.md cli/README.md

  leaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: No private infrastructure references or key patterns
        # Private patterns (infrastructure names/IPs) live in the LEAK_PATTERNS secret so the
        # check itself does not publish them. Generic key patterns are safe to keep here.
        env:
          PRIVATE_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
        run: |
          patterns='/Users/|sk_[A-Za-z0-9]{16,}|afk_[A-Za-z0-9]{8,}|ya29\.'
          [ -n "$PRIVATE_PATTERNS" ] && patterns="$patterns|$PRIVATE_PATTERNS"
          if git grep -nE "$patterns" -- . ':!.github/workflows/guard.yml'; then
            echo "Private reference or secret-like pattern found"; exit 1
          fi
      - name: Internal design docs never committed
        run: |
          if git log --all --name-only --format= | grep -qxE 'SPEC\.md|CAVEMAN\.md'; then
            echo "SPEC.md or CAVEMAN.md exists in git history"; exit 1
          fi
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
