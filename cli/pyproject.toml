[project]
name = "resonance-lite"
version = "0.1.0"
description = "Make long-form functional sound videos for YouTube from a single prompt in Claude Code"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mariano Pfeiffer" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "jsonschema>=4.23,<5",
    "keyring>=25,<26",
    "pillow>=11,<12",
    "pyyaml>=6,<7",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
stabilize = ["opencv-python-headless>=4.10,<5", "numpy>=2,<3"]

[project.scripts]
rlite = "rl.cli:main"
rl = "rl.cli:main"

[project.urls]
Repository = "https://github.com/marianopfeiffer-AMG/resonance-lite"

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8,<9",
    "ruff>=0.8,<1",
    "types-pyyaml>=6,<7",
    "types-requests>=2.32,<3",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rl"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
